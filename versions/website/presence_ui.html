<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClientIndicator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0a080f;
    --bg2:       #120e1c;
    --bg3:       #1a1428;
    --bg4:       #231c36;
    --border:    rgba(139, 92, 246, 0.18);
    --border2:   rgba(139, 92, 246, 0.35);
    --p1:        #8b5cf6;
    --p2:        #a78bfa;
    --p3:        #c4b5fd;
    --p4:        #6d28d9;
    --pink:      #ec4899;
    --red:       #f87171;
    --green:     #34d399;
    --text:      #e2d9f3;
    --text-dim:  #7c6fa0;
    --text-muted:#3d3358;
    --glow:      rgba(139, 92, 246, 0.4);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* ── animated gradient background ── */
  .bg-gradient {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse 80% 60% at 20% 10%, rgba(109,40,217,0.35) 0%, transparent 60%),
      radial-gradient(ellipse 60% 80% at 80% 90%, rgba(139,92,246,0.25) 0%, transparent 60%),
      radial-gradient(ellipse 50% 50% at 50% 50%, rgba(236,72,153,0.08) 0%, transparent 70%),
      var(--bg);
    animation: bgShift 12s ease-in-out infinite alternate;
  }

  @keyframes bgShift {
    0%   { background-position: 0% 0%, 100% 100%, 50% 50%; }
    33%  {
      background:
        radial-gradient(ellipse 80% 60% at 40% 30%, rgba(109,40,217,0.4) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 60% 70%, rgba(139,92,246,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 30% 80%, rgba(236,72,153,0.12) 0%, transparent 70%),
        var(--bg);
    }
    66%  {
      background:
        radial-gradient(ellipse 80% 60% at 70% 60%, rgba(109,40,217,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 20% 30%, rgba(167,139,250,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 80% 20%, rgba(236,72,153,0.1) 0%, transparent 70%),
        var(--bg);
    }
    100% {
      background:
        radial-gradient(ellipse 80% 60% at 10% 80%, rgba(109,40,217,0.38) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 90% 20%, rgba(139,92,246,0.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 50% at 50% 50%, rgba(236,72,153,0.09) 0%, transparent 70%),
        var(--bg);
    }
  }

  /* grain overlay */
  .bg-gradient::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    background-size: 128px 128px;
    opacity: 0.6;
    pointer-events: none;
  }

  /* ── layout ── */
  .app {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 20px 40px;
  }

  /* ── header ── */
  header {
    padding: 32px 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    display: flex;
    align-items: baseline;
    gap: 6px;
  }

  .logo-main {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--p2) 0%, var(--pink) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo-sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  .token-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-dim);
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 12px;
    transition: all 0.3s;
  }

  .token-badge.ready {
    color: var(--green);
    border-color: rgba(52,211,153,0.3);
    background: rgba(52,211,153,0.06);
  }

  .token-badge.error {
    color: var(--red);
    border-color: rgba(248,113,113,0.3);
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }

  .dot.pulse {
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.8); }
  }

  /* ── players section ── */
  .section-title {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin: 28px 0 14px;
  }

  .players-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── player card ── */
  .card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    transition: border-color 0.3s, box-shadow 0.3s;
    animation: cardIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(-12px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .card.online {
    border-color: var(--border2);
    box-shadow: 0 0 24px rgba(139,92,246,0.12), inset 0 0 0 1px rgba(139,92,246,0.08);
  }

  .card-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    background: var(--bg3);
    border-bottom: 1px solid var(--border);
  }

  .status-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
    transition: background 0.3s, box-shadow 0.3s;
  }

  .card.online .status-indicator {
    background: var(--p2);
    box-shadow: 0 0 8px var(--glow);
    animation: pulse 2s ease-in-out infinite;
  }

  .card-name {
    flex: 1;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .card.online .card-name {
    color: var(--p3);
  }

  .btn-remove {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 16px;
    line-height: 1;
    padding: 2px 4px;
    border-radius: 4px;
    transition: color 0.2s, background 0.2s;
  }

  .btn-remove:hover {
    color: var(--red);
    background: rgba(248,113,113,0.1);
  }

  .card-body {
    padding: 14px 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .field label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .field input {
    background: var(--bg4);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 10px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    width: 100%;
  }

  .field input:focus {
    border-color: var(--p1);
    box-shadow: 0 0 0 3px rgba(139,92,246,0.15);
  }

  .field input:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .field.wide {
    grid-column: 1 / -1;
  }

  .card-footer {
    padding: 0 16px 14px;
  }

  .btn-connect {
    width: 100%;
    padding: 9px;
    border-radius: 9px;
    border: 1px solid var(--p4);
    background: rgba(109,40,217,0.15);
    color: var(--p2);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.02em;
  }

  .btn-connect:hover {
    background: rgba(139,92,246,0.25);
    border-color: var(--p2);
    box-shadow: 0 0 16px rgba(139,92,246,0.2);
  }

  .btn-connect.active {
    background: rgba(248,113,113,0.1);
    border-color: rgba(248,113,113,0.4);
    color: var(--red);
  }

  .btn-connect.active:hover {
    background: rgba(248,113,113,0.18);
    box-shadow: 0 0 16px rgba(248,113,113,0.15);
  }

  /* ── add button ── */
  .btn-add {
    margin-top: 12px;
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px dashed var(--border2);
    background: transparent;
    color: var(--p2);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-add:hover {
    background: rgba(139,92,246,0.08);
    border-color: var(--p1);
    box-shadow: 0 0 20px rgba(139,92,246,0.1);
  }

  .btn-add svg { flex-shrink: 0; }

  /* ── log ── */
  .log-section {
    margin-top: 28px;
  }

  .log-box {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    max-height: 180px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--bg4) transparent;
  }

  .log-entry {
    display: flex;
    gap: 10px;
    font-size: 12px;
    line-height: 1.5;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .log-time { color: var(--text-muted); font-weight: 500; flex-shrink: 0; }
  .log-action { font-weight: 700; flex-shrink: 0; width: 52px; }
  .log-action.JOIN  { color: var(--green); }
  .log-action.LEAVE { color: var(--red); }
  .log-action.TOKEN { color: var(--p2); }
  .log-action.ERROR { color: var(--red); }
  .log-text { color: var(--text-dim); }

  .log-empty {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 12px 0;
  }

  /* ── stats bar ── */
  .stats {
    display: flex;
    gap: 20px;
    margin-top: 20px;
    padding: 12px 16px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-size: 20px;
    font-weight: 700;
    background: linear-gradient(135deg, var(--p2), var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .stat-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-divider {
    width: 1px;
    background: var(--border);
    align-self: stretch;
  }

  .tabs {
  display: flex;
  gap: 4px;
  background: var(--bg3);
  border-radius: 10px;
  padding: 4px;
}

.tab-btn {
  padding: 8px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 13px;
  font-weight: 600;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.2s;
}

.tab-btn.active {
  background: var(--bg4);
  color: var(--text);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}

.tab-content {
  display: none;
}

.tab-content.active {
  display: block;
}

.btn-disconnect-all {
  padding: 8px 16px;
  background: rgba(248, 113, 113, 0.15);
  color: var(--red);
  border: 1px solid rgba(248, 113, 113, 0.4);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-disconnect-all:hover {
  background: rgba(248, 113, 113, 0.25);
  border-color: var(--red);
}

</style>
</head>
<body>
<div class="bg-gradient"></div>
<div class="app">
  <header>
  <div class="logo">
    <span class="logo-main">ClientIndicator</span>
    <span class="logo-sub">presence manager</span>
  </div>
  
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab(0)">Home</button>
    <button class="tab-btn" onclick="switchTab(1)">Server</button>
  </div>

  <div style="display:flex; gap:8px; align-items:center;">
    <button onclick="disconnectAll()" class="btn-disconnect-all">
      Disconnect All
    </button>
    <div class="token-badge" id="tokenBadge">
      <div class="dot pulse"></div>
      <span id="tokenText">connecting...</span>
    </div>
  </div>
  </header>

  <div class="stats" id="stats">
    <div class="stat">
      <div class="stat-value" id="statTotal">0</div>
      <div class="stat-label">Players</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-value" id="statOnline">0</div>
      <div class="stat-label">Online</div>
    </div>
    <div class="stat-divider"></div>
    <div class="stat">
      <div class="stat-value" id="statServers">0</div>
      <div class="stat-label">Servers</div>
    </div>
  </div>

  <div class="section-title">Players</div>
  <div id="home-tab" class="tab-content active">
  <div class="section-title">Players</div>
  <div class="players-list" id="playersList"></div>

  <button class="btn-add" onclick="addCard()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Add Player
  </button>
</div>

<!-- Server tab -->
<div id="server-tab" class="tab-content">
  <div class="section-title">Auto-connect from Server</div>
  <div class="card" style="margin-bottom: 16px;">
    <div class="card-body">
      <div class="field wide">
        <label>Server IP:Port</label>
        <input type="text" id="server-input" value="46.174.54.240:8337" placeholder="ip:port">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn-connect" onclick="connectServer()">Connect All Players</button>
    </div>
  </div>
  <div id="server-players" class="players-list"></div>
</div>

  <button class="btn-add" onclick="addCard()">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
    Add Player
  </button>

  <div class="log-section">
    <div class="section-title">Activity Log</div>
    <div class="log-box" id="logBox">
      <div class="log-empty" id="logEmpty">No activity yet</div>
    </div>
  </div>
</div>

<script>
let cardCounter = 0;
const cards = {};       // uid → { el, online, name }
let knownLogCount = 0;
let tokenReady = false;

// ── card management ────────────────────────────────────────────────────────────
function uid() {
  return Math.random().toString(36).slice(2) + Date.now().toString(36);
}

function addCard() {
  cardCounter++;
  const id = uid();
  const num = cardCounter;

  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.uid = id;
  card.innerHTML = `
    <div class="card-header">
      <div class="status-indicator"></div>
      <span class="card-name">Player #${num}</span>
      <button class="btn-remove" onclick="removeCard('${id}')" title="Remove">✕</button>
    </div>
    <div class="card-body">
      <div class="field wide">
        <label>Player Name</label>
        <input type="text" id="name-${id}" value="Player${num}" placeholder="Name">
      </div>
      <div class="field">
        <label>Game Server</label>
        <input type="text" id="server-${id}" value="127.0.0.1:8303" placeholder="ip:port">
      </div>
      <div class="field">
        <label>Client ID</label>
        <input type="number" id="cid-${id}" value="${num}" min="0" max="255" placeholder="1">
      </div>
    </div>
    <div class="card-footer">
      <button class="btn-connect" id="btn-${id}" onclick="toggleConnect('${id}')">Connect</button>
    </div>
  `;

  document.getElementById('playersList').appendChild(card);
  cards[id] = { el: card, online: false, name: `Player${num}` };
  updateStats();
}

function removeCard(id) {
  const c = cards[id];
  if (!c) return;
  if (c.online) {
    disconnect(id).then(() => { c.el.remove(); delete cards[id]; updateStats(); });
  } else {
    c.el.remove();
    delete cards[id];
    updateStats();
  }
}

// ── connect / disconnect ───────────────────────────────────────────────────────
async function toggleConnect(id) {
  const c = cards[id];
  if (!c) return;
  c.online ? await disconnect(id) : await connect(id);
}

async function connect(id) {
  const name   = document.getElementById(`name-${id}`).value.trim();
  const server = document.getElementById(`server-${id}`).value.trim();
  const cid    = parseInt(document.getElementById(`cid-${id}`).value, 10);
  const btn    = document.getElementById(`btn-${id}`);

  if (!name || !server) return alert('Name and Server are required');
  if (isNaN(cid)) return alert('Client ID must be a number');

  btn.disabled = true;
  btn.textContent = 'Connecting...';

  try {
    const res = await fetch('/api/connect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: id, name, server, client_id: cid }),
    });
    const data = await res.json();
    if (!res.ok) { alert(data.error || 'Error'); btn.disabled = false; btn.textContent = 'Connect'; return; }

    cards[id].online = true;
    cards[id].name = name;
    cards[id].el.classList.add('online');
    cards[id].el.querySelector('.card-name').textContent = name;
    btn.textContent = 'Disconnect';
    btn.classList.add('active');
    btn.disabled = false;
    setInputsDisabled(id, true);
    updateStats();
  } catch(e) {
    alert('Connection error: ' + e.message);
    btn.disabled = false;
    btn.textContent = 'Connect';
  }
}

async function disconnect(id) {
  const btn = document.getElementById(`btn-${id}`);
  if (btn) { btn.disabled = true; btn.textContent = 'Disconnecting...'; }

  try {
    await fetch('/api/disconnect', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid: id }),
    });
  } catch(e) { /* ignore */ }

  if (cards[id]) {
    cards[id].online = false;
    cards[id].el.classList.remove('online');
    if (btn) { btn.textContent = 'Connect'; btn.classList.remove('active'); btn.disabled = false; }
    setInputsDisabled(id, false);
    updateStats();
  }
}

function setInputsDisabled(id, disabled) {
  ['name', 'server', 'cid'].forEach(f => {
    const el = document.getElementById(`${f}-${id}`);
    if (el) el.disabled = disabled;
  });
}

// ── stats ──────────────────────────────────────────────────────────────────────
function updateStats() {
  const total = Object.keys(cards).length;
  const online = Object.values(cards).filter(c => c.online).length;
  const servers = new Set(
    Object.values(cards)
      .filter(c => c.online)
      .map(c => document.getElementById(`server-${Object.keys(cards).find(k => cards[k] === c)}`)?.value)
      .filter(Boolean)
  ).size;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statOnline').textContent = online;
  document.getElementById('statServers').textContent = servers;
}

// ── log polling ────────────────────────────────────────────────────────────────
function renderLog(entries) {
  const box = document.getElementById('logBox');
  const empty = document.getElementById('logEmpty');

  if (!entries.length) { if(empty) empty.style.display = ''; return; }
  if (empty) empty.style.display = 'none';

  // only render new entries (entries come reversed from server)
  const newCount = entries.length - knownLogCount;
  if (newCount <= 0) return;
  knownLogCount = entries.length;

  entries.slice(0, newCount).forEach(e => {
    const row = document.createElement('div');
    row.className = 'log-entry';
    row.innerHTML = `
      <span class="log-time">${e.time}</span>
      <span class="log-action ${e.action}">${e.action}</span>
      <span class="log-text">${e.name} ${e.action === 'JOIN' ? '→' : e.action === 'LEAVE' ? '←' : '·'} ${e.server}</span>
    `;
    box.insertBefore(row, box.firstChild);
  });
}

function updateTokenBadge(status) {
  const badge = document.getElementById('tokenBadge');
  const text  = document.getElementById('tokenText');
  const dot   = badge.querySelector('.dot');

  if (status.token) {
    badge.className = 'token-badge ready';
    text.textContent = status.token;
    dot.classList.remove('pulse');
    tokenReady = true;
  } else if (status.token_error) {
    badge.className = 'token-badge error';
    text.textContent = 'token error';
    dot.classList.remove('pulse');
  }
}

async function poll() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    updateTokenBadge(data);
    renderLog(data.log);
  } catch(e) { /* backend not ready */ }
}

poll();

let currentTab = 0;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === tab);
  });
  document.getElementById('home-tab').classList.toggle('active', tab === 0);
  document.getElementById('server-tab').classList.toggle('active', tab === 1);
}

async function connectServer() {
  const input = document.getElementById('server-input').value.trim();
  if (!input) return alert('Enter server ip:port');
  
  const [ip, port] = input.split(':');
  if (!ip || !port) return alert('Invalid format. Use ip:port');

  const btn = event.currentTarget;
  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = 'Connecting all players...';

  try {
    const res = await fetch(`https://api.status.tw/server/${ip}/${port}`);
    const data = await res.json();
    
    const players = data.online?.clients || [];
    let connectedCount = 0;

    for (const client of players) {
      if (!client.isPlayer || !client.name) continue;

      const uidStr = uid();
      const name = client.name;
      const serverAddr = input;
      const cid = Math.floor(Math.random() * 200) + 1; // или можно использовать client.score / другой способ

      try {
        const connectRes = await fetch('/api/connect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            uid: uidStr, 
            name: name, 
            server: serverAddr, 
            client_id: cid 
          }),
        });

        if (connectRes.ok) {
          connectedCount++;
          // Добавляем карточку в Home (как в обычном режиме)
          addPreConnectedCard(uidStr, name, serverAddr, cid);
        }
      } catch(e) {
        console.error('Failed to connect player', name);
      }
    }

    alert(`Connected ${connectedCount} players from server`);
  } catch(e) {
    alert('Failed to fetch server info');
  } finally {
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

// Добавляет готовую подключённую карточку во вкладку Home
function addPreConnectedCard(uidStr, name, serverAddr, cid) {
  const card = document.createElement('div');
  card.className = 'card online';
  card.dataset.uid = uidStr;
  card.innerHTML = `
    <div class="card-header">
      <div class="status-indicator"></div>
      <span class="card-name">${name}</span>
      <button class="btn-remove" onclick="removeCard('${uidStr}')" title="Remove">✕</button>
    </div>
    <div class="card-body">
      <div class="field wide">
        <label>Player Name</label>
        <input type="text" id="name-${uidStr}" value="${name}" disabled>
      </div>
      <div class="field">
        <label>Game Server</label>
        <input type="text" id="server-${uidStr}" value="${serverAddr}" disabled>
      </div>
      <div class="field">
        <label>Client ID</label>
        <input type="number" id="cid-${uidStr}" value="${cid}" disabled>
      </div>
    </div>
    <div class="card-footer">
      <button class="btn-connect active" id="btn-${uidStr}" onclick="toggleConnect('${uidStr}')">Disconnect</button>
    </div>
  `;

  document.getElementById('playersList').appendChild(card);
  cards[uidStr] = { el: card, online: true, name: name };
  updateStats();
}

async function disconnectAll() {
  if (!confirm('Disconnect all clients?')) return;

  const btns = document.querySelectorAll('.btn-connect.active');
  let count = 0;

  for (const uid in cards) {
    if (cards[uid].online) {
      try {
        await fetch('/api/disconnect', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ uid: uid }),
        });
        count++;
      } catch(e) {}
    }
  }

  // Обновляем UI
  Object.keys(cards).forEach(id => {
    if (cards[id].online) {
      disconnectUIOnly(id);
    }
  });

  alert(`Disconnected ${count} clients`);
  updateStats();
}

function disconnectUIOnly(id) {
  const c = cards[id];
  if (!c) return;
  c.online = false;
  c.el.classList.remove('online');
  const btn = document.getElementById(`btn-${id}`);
  if (btn) {
    btn.textContent = 'Connect';
    btn.classList.remove('active');
  }
  setInputsDisabled(id, false);
}
